name: '编译并推送vcenter模块镜像'

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties

      - name: Build
        timeout-minutes: 20
        run: |
          ./gradlew :vcenter:shadowJar --no-daemon --console=plain --stacktrace
          test -s vcenter/build/libs/vcenter-0.0.1-all.jar

      - name: Build and Push Docker Image
        env:
          image: ${{ secrets.ALIYUN_DOCKER_REGISTRY }}/${{ secrets.ALIYUN_DOCKER_NAMESPACE }}/vcenter
          tags: ${{ github.sha }}
          registry: ${{ secrets.ALIYUN_DOCKER_REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
        run: |
          cd vcenter
          printf '%s' "$password" | docker login "$registry" --username "$username" --password-stdin
          docker build -t "$image:$tags" .
          docker push "$image:$tags"
